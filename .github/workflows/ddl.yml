name: Deploy DDL

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - 'ddl/**'

  push:
    branches:
      - dev
      - main
    paths:
      - 'ddl/**'

  workflow_dispatch:

jobs:
  deploy-schema:
    runs-on: ubuntu-latest
    
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Databricks CLI & Dependencies
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
          pip install databricks-sql-cli

      - name: Test Databricks CLI Connection
        run: |
          databricks current-user me

      - name: Execute DDL from Notebooks/Files
        run: |
          python - << 'EOF'
          import os
          import subprocess

          host = os.environ["DATABRICKS_HOST"].replace("https://", "")
          token = os.environ["DATABRICKS_TOKEN"]
          warehouse_id = "2d82741f78a6da87"

          print(f"Executando na branch/ref: {os.environ.get('GITHUB_REF_NAME', 'desconhecida')}")
          print("Procurando arquivos na pasta ddl...")
          
          for root, dirs, files in os.walk("./ddl"):
              for file in files:
                  file_path = os.path.join(root, file)
                  print(f"Processando: {file_path}")
                  
                  with open(file_path, "r", encoding="utf-8") as f:
                      content = f.read()
                  
                  # Remove a linha do %sql e limpa espaços vazios mantendo o restante do código
                  sql_lines = [
                      line for line in content.splitlines() 
                      if not line.strip().startswith("%sql")
                  ]
                  sql_clean = "\n".join(sql_lines).strip()
                  
                  if sql_clean:
                      print("Enviando SQL limpo para o Warehouse...")
                      
                      temp_sql = "temp_exec.sql"
                      with open(temp_sql, "w", encoding="utf-8") as tmp:
                          tmp.write(sql_clean)
                      
                      cmd = [
                          "dbsqlcli",
                          "--hostname", host,
                          "--http-path", f"/sql/1.0/warehouses/{warehouse_id}",
                          "--access-token", token,
                          "-e", temp_sql
                      ]
                      
                      result = subprocess.run(cmd, capture_output=True, text=True)
                      print(result.stdout)
                      
                      if result.returncode != 0:
                          print(result.stderr)
                          exit(result.returncode)
                          
                      if os.path.exists(temp_sql):
                          os.remove(temp_sql)
                          
                      print("-" * 50)
          EOF