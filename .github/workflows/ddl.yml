name: Deploy DDL

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - 'ddl/**'

  push:
    branches:
      - dev
      - main
    paths:
      - 'ddl/**'

  workflow_dispatch:

jobs:
  deploy-schema:
    runs-on: ubuntu-latest
    
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Databricks CLI & Dependencies
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
          pip install databricks-sql-cli

      - name: Test Databricks CLI Connection
        run: |
          databricks current-user me

      - name: Execute DDL SQL files
        run: |
          echo "Procurando arquivos .sql na pasta ddl..."
          
          # Varre apenas arquivos com extensão .sql para evitar notebooks ipynb
          find ./ddl -type f -name "*.sql" | while read -r file; do
            echo "Processando o arquivo: $file"
            
            # Executa o arquivo SQL diretamente no Warehouse utilizando o databricks-sql-cli
            dbsqlcli --hostname "$(echo $DATABRICKS_HOST | sed 's|https://||g')" \
                     --http-path "/sql/1.0/warehouses/2d82741f78a6da87" \
                     --access-token "$DATABRICKS_TOKEN" \
                     -e "$file"
                     
            echo "--------------------------------------------------"
          done