name: Deploy DDL

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - 'ddl/**'

  push:
    branches:
      - dev
      - main
    paths:
      - 'ddl/**'

  workflow_dispatch:

jobs:
  deploy-schema:
    runs-on: ubuntu-latest
    
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Test Databricks CLI Connection
        run: |
          databricks current-user me

      - name: Execute DDL files via Databricks CLI
        run: |
          echo "Procurando arquivos DDL..."
          
          # Varre todos os arquivos dentro da pasta ddl de forma recursiva
          find ./ddl -type f | while read -r file; do
            echo "Processando: $file"
            
            # Lê o conteúdo completo do arquivo DDL
            SQL_CONTENT=$(cat "$file")
            
            if [ -n "$SQL_CONTENT" ]; then
              echo "Enviando query para o Databricks SQL Warehouse..."
              # Correção: mudou de statement-execution execute para statement execute
              databricks statement execute \
                --warehouse-id "2d82741f78a6da87" \
                --statement "$SQL_CONTENT"
              echo "--------------------------------------------------"
            fi
          done