name: Deploy DDL

on:
  push:
    branches:
      - dev
      - main
    paths:
      - 'ddl/**'

  workflow_dispatch:

jobs:
  deploy-notebooks:
    runs-on: ubuntu-latest
   
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_CLUSTER_ID }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Databricks SQL CLI
        run: |
          pip install databricks-sql-cli

      - name: Extract and Execute SQL from IPYNB Notebooks
        run: |
          echo "Procurando notebooks .ipynb locais de forma ordenada..."
          
          # Limpa o host
          CLEAN_HOST=$(echo "$DATABRICKS_HOST" | sed -e 's|^https://||' -e 's|^http://||')

          # Varre os arquivos .ipynb locais que o GitHub acabou de baixar
          find ./ddl -type f -name "*.ipynb" | sort | while read -r file; do
            echo "=================================================="
            echo "Processando arquivo local: $file"
            
            # Script em Python de 1 linha para ler o arquivo .ipynb (JSON) e extrair apenas o texto das células que começam com %sql
            SQL_COMMANDS=$(python3 -c "
import json
with open('$file', 'r') as f:
    data = json.load(f)
sql_lines = []
for cell in data.get('cells', []):
    if cell.get('cell_type') == 'code':
        source = cell.get('source', [])
        # Junta as linhas da célula para verificar o conteúdo
        cell_text = ''.join(source).strip()
        if cell_text.startswith('%sql'):
            # Remove o '%sql' e limpa as quebras de linha extras
            sql_lines.append(cell_text.replace('%sql', '', 1).strip())
print('\n;\n'.join(sql_lines))
")

            if [ -z "$SQL_COMMANDS" ]; then
              echo "Aviso: Nenhuma célula %sql encontrada no notebook $file. Pulando..."
              continue
            fi

            echo "Executando comandos extraídos no SQL Warehouse..."
            
            # Envia os comandos SQL extraídos diretamente para o seu Warehouse
            if ! dbsqlcli --hostname "$CLEAN_HOST" \
                          --http-path "/sql/1.0/warehouses/$DATABRICKS_WAREHOUSE_ID" \
                          --access-token "$DATABRICKS_TOKEN" \
                          -e "$SQL_COMMANDS"; then
              echo "❌ ERRO: Falha ao executar o SQL do arquivo $file"
              exit 1
            fi
            
            echo "✅ Comandos SQL aplicados com SUCESSO!"
            echo "=================================================="
          done