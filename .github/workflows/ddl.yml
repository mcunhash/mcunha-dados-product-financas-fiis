- name: Execute DDL notebooks/files via Databricks CLI
        run: |
          python - "$DATABRICKS_HOST" "$DATABRICKS_TOKEN" << 'EOF'
          import os
          import sys
          import subprocess

          host = sys.argv[1]
          token = sys.argv[2]
          warehouse_id = "2d82741f78a6da87"

          # Varre recursivamente a pasta ddl
          for root, dirs, files in os.walk("./ddl"):
              for file in files:
                  file_path = os.path.join(root, file)
                  print(f"Processando: {file_path}")
                  
                  with open(file_path, "r", encoding="utf-8") as f:
                      content = f.read()
                  
                  # Remove a linha do %sql (caso exista) para não gerar erro de sintaxe
                  sql_clean = "\n".join([
                      line for line in content.splitlines() 
                      if not line.strip().startswith("%sql")
                  ])
                  
                  if sql_clean.strip():
                      print("Enviando query limpa para o Databricks SQL Warehouse...")
                      
                      # Usa o comando nativo da CLI para executar o SQL statement
                      cmd = [
                          "databricks", "statement-execution", "execute",
                          "--warehouse-id", warehouse_id,
                          "--statement", sql_clean,
                          "--host", host,
                          "--token", token
                      ]
                      
                      result = subprocess.run(cmd, capture_output=True, text=True)
                      print(result.stdout)
                      if result.returncode != 0:
                          print(result.stderr, file=sys.stderr)
                          sys.exit(result.returncode)
                      print("-" * 50)
          EOF