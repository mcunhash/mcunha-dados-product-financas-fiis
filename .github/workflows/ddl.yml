name: Deploy DDL

on:
  push:
    branches:
      - dev
      - main
    paths:
      - 'ddl/**'

  workflow_dispatch:

jobs:
  deploy-notebooks:
    runs-on: ubuntu-latest
   
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_CLUSTER_ID }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Databricks SQL CLI
        run: |
          pip install databricks-sql-cli

      - name: Execute SQL from Notebooks
        run: |
          echo "Procurando notebooks .ipynb locais de forma ordenada..."
          
          # Limpa o host para o formato correto
          CLEAN_HOST=$(echo "$DATABRICKS_HOST" | sed -e 's|^https://||' -e 's|^http://||')

          # Varre os arquivos na pasta ddl de forma ordenada
          find ./ddl -type f -name "*.ipynb" | sort | while read -r file; do
            echo "=================================================="
            echo "Processando o arquivo: $file"
            
            # Executa o script python auxiliar para extrair o SQL
            SQL_COMMANDS=$(python3 scripts/extract_sql.py "$file")
            
            if [ -z "$SQL_COMMANDS" ]; then
              echo "Aviso: Nenhuma célula %sql encontrada no notebook. Pulando..."
              continue
            fi

            echo "Executando comandos extraídos no SQL Warehouse..."
            
            # Envia os comandos SQL extraídos diretamente para o seu Warehouse
            if ! dbsqlcli --hostname "$CLEAN_HOST" \
                          --http-path "/sql/1.0/warehouses/$DATABRICKS_WAREHOUSE_ID" \
                          --access-token "$DATABRICKS_TOKEN" \
                          -e "$SQL_COMMANDS"; then
              echo "❌ ERRO: Falha ao executar o SQL do arquivo $file"
              exit 1
            fi
            
            echo "✅ Comandos SQL aplicados com SUCESSO!"
            echo "=================================================="
          done