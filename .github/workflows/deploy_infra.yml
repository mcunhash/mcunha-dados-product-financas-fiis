name: Deploy Databricks Infrastructure

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  deploy-schema:
    runs-on: ubuntu-latest
    
    # ⚠️ IMPORTANTE: Definir os secrets no nível do Job garante que 
    # todas as etapas abaixo consigam enxergá-los automaticamente.
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Test Databricks CLI Connection
        run: |
          # Correção de currentUser para current-user
          databricks current-user me

      - name: Execute DDL via SQL Statement Execution API / Databricks CLI
        run: |
          SQL_CONTENT=$(cat ./sql/create_schema.sql)
          
          databricks statement-execution execute \
            --warehouse-id "2d82741f78a6da87" \
            --statement "$SQL_CONTENT"